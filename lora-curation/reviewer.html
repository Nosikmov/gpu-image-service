<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoRA Curation — gameFarmling</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12141a;
      --panel: #1b1f28;
      --border: #2c3340;
      --text: #e8ecf2;
      --muted: #9aa3b2;
      --approve: #3ecf8e;
      --reject: #ff6b6b;
      --maybe: #f0b429;
      --accent: #7aa2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
    .stats span b { color: var(--text); }
    .auto-line {
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--accent);
    }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    select, button, textarea, input[type="text"] {
      background: #0f1218;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    button { cursor: pointer; }
    button.primary { background: #24304a; border-color: #3d4f73; }
    button.approve { border-color: #2f8f62; color: var(--approve); }
    button.reject { border-color: #a34a4a; color: var(--reject); }
    button.maybe { border-color: #9a7a1f; color: var(--maybe); }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .queue-list {
      max-height: calc(100vh - 280px);
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .queue-item {
      text-align: left;
      width: 100%;
      border-radius: 8px;
      border: 1px solid transparent;
      background: #141821;
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
    }
    .queue-item.active { border-color: var(--accent); background: #1a2233; }
    .queue-item .id { font-size: 0.78rem; color: var(--muted); }
    .queue-item .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 999px;
      margin-left: 6px;
      border: 1px solid var(--border);
    }
    .badge.approve { color: var(--approve); border-color: #2f8f62; }
    .badge.reject { color: var(--reject); border-color: #a34a4a; }
    .queue-item .badge.hidden { display: none; }
    .preview-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      background: repeating-conic-gradient(#222 0% 25%, #1a1a1a 0% 50%) 50% / 24px 24px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .preview-wrap img {
      max-width: 100%;
      max-height: 520px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.45));
    }
    .placeholder {
      color: var(--muted);
      text-align: center;
      padding: 40px;
    }
    .prompt {
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 0.92rem;
      color: #d5dbe6;
      max-height: 180px;
      overflow: auto;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .meta { color: var(--muted); font-size: 0.82rem; margin-top: 8px; }
    textarea { width: 100%; min-height: 72px; margin-top: 10px; resize: vertical; }
    .add-box { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    .add-box h3 { margin: 0 0 8px; font-size: 0.95rem; }
    .add-box .hint { color: var(--muted); font-size: 0.78rem; margin-bottom: 8px; }
    .add-box input[type="text"] { width: 100%; margin-bottom: 8px; }
    .progress {
      height: 8px;
      background: #0f1218;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress > div {
      height: 100%;
      background: linear-gradient(90deg, var(--approve), var(--accent));
      width: 0%;
      transition: width .2s ease;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LoRA Style Curation</h1>
      <div class="stats" id="stats"></div>
      <div class="auto-line" id="autoLine">авто: …</div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
    <div class="filters">
      <label>
        Фильтр
        <select id="filterRating">
          <option value="">все</option>
          <option value="unset" selected>не оценено</option>
          <option value="approve">approve</option>
          <option value="maybe">maybe</option>
          <option value="reject">reject</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="onlyWithImage" checked /> только с картинкой
      </label>
      <label>
        Сортировка
        <select id="sortBy">
          <option value="id" selected>id (A→Z)</option>
          <option value="title">название</option>
          <option value="rating">рейтинг</option>
          <option value="category">категория</option>
        </select>
      </label>
      <button class="primary" id="reloadBtn">Обновить</button>
    </div>
  </header>

  <main>
    <section class="card">
      <strong>Очередь</strong>
      <div class="queue-list" id="queueList"></div>
      <div class="add-box">
        <h3>Добавить промпт</h3>
        <div class="hint">Название (English в скобках) + описание. LoRA-теги можно не писать — добавятся сами. Авто-цикл сгенерирует картинку.</div>
        <input type="text" id="newTitle" placeholder="Кот-Феникс (Phoenix Cat)" />
        <textarea id="newPrompt" placeholder="anthropomorphic cat hybrid, phoenix cat, fiery low-poly wings, … T-pose, neutral solid light grey background"></textarea>
        <div class="actions">
          <button class="primary" id="addPromptBtn">Добавить в очередь</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="preview-wrap" id="previewWrap">
        <img id="previewImg" alt="" hidden />
        <div class="placeholder" id="previewPlaceholder">Выберите элемент или нажмите «Обновить»</div>
      </div>
      <div class="meta" id="meta"></div>
      <div class="prompt" id="prompt"></div>
      <textarea id="note" placeholder="Заметка (опционально)"></textarea>
      <div class="actions">
        <button class="approve" data-rate="approve">Approve (A)</button>
        <button class="maybe" data-rate="maybe">Maybe (M)</button>
        <button class="reject" data-rate="reject">Reject (R)</button>
        <button data-rate="unset">Сброс</button>
        <button class="primary" id="prevBtn">Prev</button>
        <button class="primary" id="nextBtn">Next</button>
      </div>
    </section>
  </main>

  <script>
    let items = [];
    let index = 0;
    let selectedId = null;
    let statsCache = { approve: 0, reject: 0, maybe: 0, unset: 0 };
    let totalPrompts = 0;

    const els = {
      stats: document.getElementById("stats"),
      autoLine: document.getElementById("autoLine"),
      progressBar: document.getElementById("progressBar"),
      queueList: document.getElementById("queueList"),
      previewWrap: document.getElementById("previewWrap"),
      previewImg: document.getElementById("previewImg"),
      previewPlaceholder: document.getElementById("previewPlaceholder"),
      prompt: document.getElementById("prompt"),
      meta: document.getElementById("meta"),
      note: document.getElementById("note"),
      filterRating: document.getElementById("filterRating"),
      onlyWithImage: document.getElementById("onlyWithImage"),
      sortBy: document.getElementById("sortBy"),
      reloadBtn: document.getElementById("reloadBtn"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      newTitle: document.getElementById("newTitle"),
      newPrompt: document.getElementById("newPrompt"),
      addPromptBtn: document.getElementById("addPromptBtn"),
    };

    function current() {
      return items[index] || null;
    }

    function sortItems(list) {
      const key = els.sortBy.value || "id";
      const ratingOrder = { unset: 0, maybe: 1, reject: 2, approve: 3 };
      return [...list].sort((a, b) => {
        if (key === "rating") {
          const ra = ratingOrder[a.rating] ?? 0;
          const rb = ratingOrder[b.rating] ?? 0;
          if (ra !== rb) return ra - rb;
          return String(a.id).localeCompare(String(b.id));
        }
        const av = String(a[key] || a.id || "");
        const bv = String(b[key] || b.id || "");
        return av.localeCompare(bv, undefined, { sensitivity: "base" });
      });
    }

    function restoreSelection(preferredId) {
      const id = preferredId || selectedId;
      if (id) {
        const idx = items.findIndex((i) => i.id === id);
        if (idx >= 0) {
          index = idx;
          return;
        }
      }
      if (index >= items.length) index = Math.max(0, items.length - 1);
    }

    function renderAuto(auto) {
      if (!auto) {
        els.autoLine.textContent = "обновление списка — кнопка «Обновить»";
        return;
      }
      els.autoLine.textContent = "авто · " + `${auto.state || "?"}: ${auto.message || ""}`;
    }

    function renderStats(stats, count) {
      statsCache = { ...stats };
      const approve = stats.approve || 0;
      const totalHint = totalPrompts || (stats.approve || 0) + (stats.reject || 0) + (stats.maybe || 0) + (stats.unset || 0);
      els.stats.innerHTML = [
        `<span><b>${count}</b> в фильтре</span>`,
        `<span>✓ <b>${approve}</b></span>`,
        `<span>? <b>${stats.maybe || 0}</b></span>`,
        `<span>✕ <b>${stats.reject || 0}</b></span>`,
        `<span>○ <b>${stats.unset || 0}</b></span>`,
      ].join("");
      const denom = Math.max(1, totalHint);
      els.progressBar.style.width = `${Math.min(100, (approve / denom) * 100)}%`;
    }

    function badgeHtml(rating) {
      if (!rating || rating === "unset") return `<span class="badge hidden" data-role="badge"></span>`;
      return `<span class="badge ${rating}" data-role="badge">${rating}</span>`;
    }

    function renderQueue() {
      const scrollTop = els.queueList.scrollTop;
      els.queueList.replaceChildren();
      items.forEach((item, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "queue-item" + (i === index ? " active" : "");
        btn.dataset.index = String(i);
        btn.innerHTML = `<div><span data-role="label">${item.id}</span>${badgeHtml(item.rating)}</div><div class="id">${item.title || item.category || ""}${item.image_exists ? "" : " · нет PNG"}</div>`;
        btn.addEventListener("click", () => selectIndex(i));
        els.queueList.appendChild(btn);
      });
      els.queueList.scrollTop = scrollTop;
    }

    function setActiveQueueItem(newIndex) {
      const nodes = els.queueList.querySelectorAll(".queue-item");
      nodes.forEach((n, i) => n.classList.toggle("active", i === newIndex));
      index = newIndex;
    }

    function updateQueueBadgeAt(i, rating) {
      const node = els.queueList.children[i];
      if (!node) return;
      const badge = node.querySelector('[data-role="badge"]');
      if (!badge) return;
      if (!rating || rating === "unset") {
        badge.className = "badge hidden";
        badge.textContent = "";
      } else {
        badge.className = `badge ${rating}`;
        badge.textContent = rating;
      }
    }

    function removeQueueItemAt(i) {
      const node = els.queueList.children[i];
      if (node) node.remove();
      const nodes = els.queueList.querySelectorAll(".queue-item");
      nodes.forEach((n, idx) => { n.dataset.index = String(idx); });
    }

    function selectIndex(i) {
      if (i < 0 || i >= items.length) return;
      setActiveQueueItem(i);
      showItem(items[i]);
    }

    function showItem(item) {
      selectedId = item ? item.id : null;
      if (!item) {
        els.previewImg.hidden = true;
        els.previewPlaceholder.hidden = false;
        els.previewPlaceholder.textContent = "Нет элементов по фильтру";
        els.prompt.textContent = "";
        els.meta.textContent = "";
        els.note.value = "";
        return;
      }
      if (item.image_exists && item.image) {
        const bust = item._imgBust || item.image_mtime || "";
        const nextSrc = `/${item.image}?v=${encodeURIComponent(bust)}`;
        if (els.previewImg.getAttribute("src") !== nextSrc) {
          els.previewImg.src = nextSrc;
        }
        els.previewImg.alt = item.id;
        els.previewImg.hidden = false;
        els.previewPlaceholder.hidden = true;
      } else {
        els.previewImg.hidden = true;
        els.previewPlaceholder.hidden = false;
        els.previewPlaceholder.innerHTML = `Картинка ещё не сгенерирована<br><code>${item.id}</code>`;
      }
      els.prompt.textContent = item.prompt || "";
      els.meta.textContent = [
        item.id,
        item.title || "",
        item.rating && item.rating !== "unset" ? `rating: ${item.rating}` : "rating: unset",
      ].filter(Boolean).join(" · ");
      els.note.value = item.note || "";
    }

    async function loadItems(options = {}) {
      const keepId = options.keepId !== false ? selectedId : null;
      els.reloadBtn.disabled = true;
      els.reloadBtn.textContent = "Загрузка…";
      try {
        const params = new URLSearchParams();
        const rating = els.filterRating.value;
        if (rating) params.set("rating", rating);
        if (els.onlyWithImage.checked) params.set("only_with_image", "1");
        const res = await fetch(`/api/items?${params}`);
        const data = await res.json();
        items = sortItems(data.items || []);
        totalPrompts = (data.stats?.approve || 0) + (data.stats?.reject || 0) + (data.stats?.maybe || 0) + (data.stats?.unset || 0);
        if (!totalPrompts) totalPrompts = items.length;
        restoreSelection(keepId);
        renderStats(data.stats || {}, data.count || 0);
        renderAuto(data.auto);
        renderQueue();
        showItem(current());
      } finally {
        els.reloadBtn.disabled = false;
        els.reloadBtn.textContent = "Обновить";
      }
    }

    function bumpStats(oldRating, newRating) {
      const from = oldRating && oldRating !== "unset" ? oldRating : "unset";
      const to = newRating && newRating !== "unset" ? newRating : "unset";
      if (from === to) return;
      if (from !== "unset" && statsCache[from] > 0) statsCache[from]--;
      else if (from === "unset" && statsCache.unset > 0) statsCache.unset--;
      if (to !== "unset") statsCache[to] = (statsCache[to] || 0) + 1;
      else statsCache.unset = (statsCache.unset || 0) + 1;
      renderStats(statsCache, items.length);
    }

    async function rate(rating) {
      const item = current();
      if (!item) return;

      const oldRating = item.rating || "unset";
      const note = els.note.value.trim();
      const filter = els.filterRating.value;
      const leavesFilter = filter && rating !== "unset" && rating !== filter;

      item.rating = rating === "unset" ? "unset" : rating;
      item.note = note;

      if (leavesFilter) {
        removeQueueItemAt(index);
        items.splice(index, 1);
        if (index >= items.length) index = Math.max(0, items.length - 1);
        setActiveQueueItem(index);
      } else {
        updateQueueBadgeAt(index, item.rating);
        if (rating !== "unset" && index < items.length - 1) {
          index += 1;
        }
        setActiveQueueItem(index);
      }

      bumpStats(oldRating, item.rating);
      renderStats(statsCache, items.length);
      showItem(current());

      fetch("/api/rate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: item.id, rating, note }),
      })
        .then((res) => {
          if (!res.ok) throw new Error("save failed");
          return res.json();
        })
        .then((data) => {
          if (data.stats) renderStats(data.stats, items.length);
        })
        .catch(() => alert("Не удалось сохранить оценку — обновите страницу"));
    }

    async function addPrompt() {
      const title = els.newTitle.value.trim();
      const prompt = els.newPrompt.value.trim();
      if (!title || !prompt) {
        alert("Нужны название и промпт");
        return;
      }
      const res = await fetch("/api/prompts/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, prompt }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "Ошибка");
        return;
      }
      els.newTitle.value = "";
      els.newPrompt.value = "";
      alert(`Добавлено: ${data.id}\nНажмите «Обновить», когда картинка будет готова.`);
    }

    document.querySelectorAll("[data-rate]").forEach((btn) => {
      btn.addEventListener("click", () => rate(btn.dataset.rate));
    });

    els.reloadBtn.addEventListener("click", () => loadItems({ keepId: selectedId }));
    els.filterRating.addEventListener("change", () => {
      selectedId = null;
      index = 0;
      loadItems({ keepId: null });
    });
    els.onlyWithImage.addEventListener("change", () => loadItems({ keepId: selectedId }));
    els.sortBy.addEventListener("change", () => {
      sessionStorage.setItem("loraReviewSort", els.sortBy.value);
      items = sortItems(items);
      restoreSelection(selectedId);
      renderQueue();
      showItem(current());
    });
    els.prevBtn.addEventListener("click", () => selectIndex(index - 1));
    els.nextBtn.addEventListener("click", () => selectIndex(index + 1));
    els.addPromptBtn.addEventListener("click", addPrompt);

    window.addEventListener("keydown", (e) => {
      if (e.target === els.note || e.target === els.newPrompt || e.target === els.newTitle) return;
      if (e.key === "a" || e.key === "A") rate("approve");
      if (e.key === "r" || e.key === "R") rate("reject");
      if (e.key === "m" || e.key === "M") rate("maybe");
      if (e.key === "ArrowLeft") els.prevBtn.click();
      if (e.key === "ArrowRight") els.nextBtn.click();
    });

    const savedSort = sessionStorage.getItem("loraReviewSort");
    if (savedSort) els.sortBy.value = savedSort;

    loadItems({ keepId: null });
  </script>
</body>
</html>
